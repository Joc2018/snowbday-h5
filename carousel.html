<script data-page-node-id="Q4ga2rfWi3EoFtqLI0LAZ3" data-pnid-children="hZmq5JkjwJzQ3grwviCc9c" type="module">
import { createCarousel, PHOTO_COUNT, initialCrop, loadPhoto, drawCrop,
  readSavedPhotos, savePhotosLocally, readSavedView, saveView, ChimeAudio,
  convertHeic, isHeicFile } from './carousel-lamp.js';

const $ = (s) => document.querySelector(s);
const host = $('#host'), loading = $('#loading'), toastEl = $('#toast');
const audio = new ChimeAudio();
let api = null, ready = false, night = true, spinning = false, selected = -1;
let choosing = false, busy = false, draft = null;
const urls = new Set();
const memories = Array.from({length: PHOTO_COUNT}, () => ({source:'',blob:null,preview:'',crop:{...initialCrop},custom:false,empty:true}));
let swapHandler = async () => {};
let viewSaveFlag = true;
const FALLBACK_KEY = 'carousel-lamp-photos-fallback-v1';

function blobFromDataUrl(dataUrl){
  if(typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) return null;
  try{
    const [head, body] = dataUrl.split(',');
    const mime = /^data:([^;]+)/.exec(head)?.[1] || 'image/jpeg';
    const bin = atob(body);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], {type:mime});
  }catch{ return null; }
}
function blobOf(memory){
  return memory?.blob || blobFromDataUrl(memory?.preview) || blobFromDataUrl(memory?.source) || null;
}
function readFallback(){
  try{
    const raw = localStorage.getItem(FALLBACK_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch{ return []; }
}
function writeFallback(records){
  try{
    const map = new Map(readFallback().map(p => [p.slot, p]));
    for(const p of records){
      if(!Number.isInteger(p.slot) || p.slot < 0 || p.slot >= PHOTO_COUNT) continue;
      map.set(p.slot, {
        slot: p.slot,
        preview: p.preview || '',
        crop: p.crop || {...initialCrop},
        empty: !!p.empty
      });
    }
    localStorage.setItem(FALLBACK_KEY, JSON.stringify([...map.values()]));
  }catch{ /* localStorage may be unavailable; IndexedDB is still primary */ }
}

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),4800); }
function setNight(on){ night = on; $('#workshop').classList.toggle('night',on); $('#lampBtn').setAttribute('aria-pressed',String(on)); $('#lampBtn').textContent = on?'关灯':'开灯'; }
function setSpinning(on){ spinning = on; $('#spinBtn').setAttribute('aria-pressed',String(on)); $('#spinBtn').textContent = on?'暂停':'旋转'; }
function renderSelection(){
  $('#focusBar').hidden = selected < 0;
  $('#photoActions').hidden = selected < 0 || choosing;
  if (selected>=0) $('#focusLabel').textContent = `相片 ${String(selected+1).padStart(2,'0')} / ${PHOTO_COUNT}`;
  $('#workshop').classList.toggle('focused', selected>=0);
}
function renderSlots(){
  const box = $('#slots'); box.innerHTML='';
  memories.forEach((m,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='slot'+(selected===i?' chosen':'');
    b.setAttribute('aria-pressed',String(selected===i));
    b.setAttribute('aria-label',`选择 ${i+1} 号位置${m.custom?'，已有相片':m.empty?'，空位':''}`);
    if(m.preview){ const im=document.createElement('img'); im.src=m.preview; im.alt=''; b.appendChild(im); }
    const sp=document.createElement('span'); sp.textContent=String(i+1).padStart(2,'0'); b.appendChild(sp);
    b.onclick=()=>{ selected=i; api?.selectMode(false); choosing=false; $('#positionPicker').hidden=true; api?.focus(i); renderSelection(); };
    box.appendChild(b);
  });
}
async function commitPhotos(fn){
  const records = await fn();
  try {
    await savePhotosLocally(records);
    writeFallback(records);
    $('#saveStatus').hidden=true;
  }
  catch(e){ $('#saveStatus').hidden=false; $('#saveStatus').dataset.state='error'; $('#saveStatus').textContent=e.message||'保存未完成，请重试'; throw e; }
}
async function restore(){
  let stored = [];
  try { stored = await readSavedPhotos(); } catch(e){ /* fall through to localStorage */ }
  const map = new Map(readFallback().map(p => [p.slot, p]));
  for(const p of stored) if(Number.isInteger(p.slot)) map.set(p.slot, p);
  for(const p of map.values()){
    if(!Number.isInteger(p.slot)||p.slot<0||p.slot>=PHOTO_COUNT) continue;
    if(!p.empty && !(p.source instanceof Blob) && !p.preview) continue;
    const blob = p.empty ? null : (p.source instanceof Blob ? p.source : blobFromDataUrl(p.preview));
    const source = p.empty ? '' : (blob ? URL.createObjectURL(blob) : p.preview);
    if(source && source.startsWith('blob:')) urls.add(source);
    memories[p.slot] = {
      source,
      blob,
      preview: p.preview || '',
      crop: p.crop || {...initialCrop},
      custom: !p.empty,
      empty: !!p.empty
    };
    await api.setPhoto(p.slot, p.empty ? null : (p.preview || source));
  }
  renderSlots();
}
async function readFile(file){
  if(!file) return null;
  const heic = isHeicFile(file);
  const okType = ['image/jpeg','image/png','image/webp'].includes(file.type.toLowerCase());
  if(!heic && !okType && !/\.(jpe?g|png|webp)$/i.test(file.name)) throw new Error('请选择 JPG、PNG、WebP 或 HEIC 图片。');
  if(file.size > 50*1024*1024) throw new Error('单张相片不能超过 50 MB。');
  return heic ? await convertHeic(file, new AbortController().signal) : file;
}
function choose(i){
  $('#positionPicker').hidden=true; choosing=false; api?.selectMode(false);
  selected=i; api?.focus(i); renderSelection(); renderSlots();
  if(memories[i].empty) openEditor();
}
function openEditor(){
  if(selected<0){ toast('先选一个相框位置'); return; }
  const m = memories[selected];
  if(m.source){
    loadPhoto(m.source).then(img=>{ draft={source:m.source,blob:blobOf(m),image:img,crop:{...m.crop}}; showEditor(); });
  } else { $('#editorInput').value=''; $('#editorInput').click(); }
}
function showEditor(){
  $('#editorError').hidden=true; $('#editor').hidden=false;
  $('#zoom').value=draft.crop.zoom; $('#posX').value=draft.crop.x; $('#posY').value=draft.crop.y;
  drawCrop($('#cropCanvas'),draft.image,draft.crop);
}
function closeEditor(){ $('#editor').hidden=true; draft=null; }
function closeAll(){ $('#uploadMenu').hidden=true; $('#editor').hidden=true; $('#positionPicker').hidden=true; }

// ---- boot ----
(async function(){
  try {
    try { const saved = readSavedView(); if(saved){ setNight(saved.night); setSpinning(saved.spinning); } } catch(e){ /* IDB blocked: keep defaults */ }
    api = createCarousel(host,
      (i)=>{ selected=i; if(i>=0) choosing=false; renderSelection(); },
      (msg)=>toast(msg),
      (from,to)=>swapHandler(from,to),
      (ok)=>{ viewSaveFlag=ok; });
    await api.ready;
    api.light(night); setNight(night); setSpinning(spinning);
    try { await restore(); } catch(e){ /* IDB blocked or no saved photos: scene still works */ }
    ready=true; loading.hidden=true;
    // force a clean overview state regardless of any early pointer/auto-focus events
    api.reset(); selected=-1; choosing=false;
    $('#positionPicker').hidden=true; $('#uploadMenu').hidden=true;
    renderSelection();
    if(spinning) api.rotate(true);
  } catch(e){ loading.textContent = '3D 场景加载失败：'+(e.message||'请刷新重试'); }
})();

// ---- toolbar ----
$('#uploadBtn').onclick=()=>{ $('#emptyCount').textContent=String(memories.filter(m=>m.empty).length); $('#batchProgress').hidden=true; $('#uploadMenu').hidden=false; audio.play('select'); };
$('#menuSingle').onclick=()=>{ $('#uploadMenu').hidden=true; api?.reset(); choosing=true; selected=-1; api?.selectMode(true); $('#positionPicker').hidden=false; renderSlots(); };
$('#pickerClose').onclick=()=>{ choosing=false; api?.selectMode(false); $('#positionPicker').hidden=true; };
$('#windBtn').onclick=()=>{ api?.wind(); audio.play('wind'); };
$('#spinBtn').onclick=()=>{ const on=!spinning; api?.rotate(on); setSpinning(on); audio.play('select'); };
$('#lampBtn').onclick=()=>{ const on=!night; api?.light(on); setNight(on); audio.play('light'); };
$('#resetBtn').onclick=()=>{ api?.reset(); audio.play('select'); };
$('#prevBtn').onclick=()=>choose((selected+PHOTO_COUNT-1)%PHOTO_COUNT);
$('#nextBtn').onclick=()=>choose((selected+1)%PHOTO_COUNT);
$('#allBtn').onclick=()=>{ api?.reset(); selected=-1; renderSelection(); audio.play('select'); };
$('#photoActions').querySelector('.act-edit').onclick=openEditor;
$('#photoActions').querySelector('.act-remove').onclick=async()=>{
  if(selected<0||busy) return;
  const slot=selected;
  try{ await commitPhotos(async()=>[{slot,source:null,preview:'',crop:{...initialCrop},empty:true}]); await api.setPhoto(slot,null); }
  catch(e){ toast(e.message); return; }
  memories[slot]={source:'',blob:null,preview:'',crop:{...initialCrop},custom:false,empty:true};
  audio.play('hang'); toast('相片已取下'); renderSlots(); renderSelection();
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ const id=b.getAttribute('data-close'); const el=document.getElementById(id); if(el) el.hidden=true; });
$('#backLink').onclick=()=>{ location.href='index.html'; };

// ---- crop editor ----
$('#editorInput').onchange=async(e)=>{
  const f=e.target.files?.[0]; e.target.value='';
  if(!f) return;
  try{
    const blob=await readFile(f); const src=URL.createObjectURL(blob); urls.add(src);
    draft={source:src,blob,image:await loadPhoto(src),crop:{...initialCrop}};
    showEditor();
  }catch(err){ toast(err.message); }
};
['zoom','posX','posY'].forEach(id=>$('#'+id).oninput=()=>{
  if(!draft) return;
  draft.crop={zoom:+$('#zoom').value,x:+$('#posX').value,y:+$('#posY').value};
  drawCrop($('#cropCanvas'),draft.image,draft.crop);
});
$('#editorSave').onclick=async()=>{
  if(!draft||selected<0||busy) return;
  busy=true;
  try{
    drawCrop($('#cropCanvas'),draft.image,draft.crop);
    const cropped=$('#cropCanvas').toDataURL('image/jpeg',0.92);
    const original=draft.blob || blobFromDataUrl(memories[selected]?.preview) || blobFromDataUrl(draft.source);
    if(!original) throw new Error('找不到原始相片数据，请重新选择这张相片。');
    const slot=selected, crop={...draft.crop};
    await commitPhotos(async()=>[{slot,source:original,preview:cropped,crop,empty:false}]);
    await api.setPhoto(slot,cropped);
    memories[slot]={source:draft.source,blob:original,preview:cropped,crop,custom:true,empty:false};
    audio.play('hang'); toast(`相片已挂在 ${String(slot+1).padStart(2,'0')} 号位置`);
    closeEditor(); renderSlots(); renderSelection();
  }catch(err){ $('#editorError').hidden=false; $('#editorError').textContent=err.message; }
  finally{ busy=false; }
};

// ---- photo package: free cross-device transfer ----
function exportPhotoPackage(){
  const photos = memories.map((m,i)=>({
    slot: i,
    preview: m.preview || '',
    crop: {...m.crop},
    empty: !!m.empty
  }));
  if(!photos.some(p=>!p.empty && p.preview)){ toast('还没有相片可导出'); return; }
  const pack = {
    app: 'snowbday-h5',
    version: 1,
    exportedAt: new Date().toISOString(),
    photos
  };
  const blob = new Blob([JSON.stringify(pack)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'snowbday-photos.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('照片包已导出，发到另一台设备导入即可');
}
async function importPhotoPackage(file){
  const text = await file.text();
  const pack = JSON.parse(text);
  const list = Array.isArray(pack?.photos) ? pack.photos : [];
  if(!list.length) throw new Error('照片包里没有相片');
  const records = [];
  for(const p of list){
    if(!Number.isInteger(p.slot) || p.slot<0 || p.slot>=PHOTO_COUNT) continue;
    if(p.empty){ records.push({slot:p.slot,source:null,preview:'',crop:{...initialCrop},empty:true}); continue; }
    if(!p.preview) continue;
    const blob = blobFromDataUrl(p.preview);
    if(!blob) continue;
    records.push({slot:p.slot,source:blob,preview:p.preview,crop:p.crop||{...initialCrop},empty:false});
  }
  if(!records.length) throw new Error('照片包格式不对，请用本网站导出的照片包');
  await commitPhotos(async()=>records);
  for(const r of records){
    if(r.empty){
      memories[r.slot] = {source:'',blob:null,preview:'',crop:{...initialCrop},custom:false,empty:true};
      await api.setPhoto(r.slot, null);
      continue;
    }
    const source = URL.createObjectURL(r.source); urls.add(source);
    memories[r.slot] = {source,blob:r.source,preview:r.preview,crop:r.crop,custom:true,empty:false};
    await api.setPhoto(r.slot, r.preview);
  }
  renderSlots(); renderSelection();
  toast(`已导入 ${records.filter(r=>!r.empty).length} 张相片`);
}
$('#menuExport').onclick=()=>{ exportPhotoPackage(); };
$('#menuImport').onclick=()=>$('#packageInput').click();
$('#packageInput').onchange=async(e)=>{
  const f=e.target.files?.[0]; e.target.value='';
  if(!f || busy) return;
  busy=true;
  try{ await importPhotoPackage(f); $('#uploadMenu').hidden=true; }
  catch(err){ toast(err.message||'照片包导入失败'); }
  finally{ busy=false; }
};

// ---- batch upload ----
$('#menuBatch').onclick=()=>$('#batchInput').click();
$('#batchInput').onchange=async(e)=>{
  const files=Array.from(e.target.files||[]); e.target.value='';
  if(!files.length||busy) return;
  const slots=memories.map((m,i)=>m.empty?i:-1).filter(i=>i>=0);
  if(!slots.length){ toast('相框已满，点相框更换'); return; }
  if(files.length>slots.length){ toast(`最多还能挂 ${slots.length} 张`); return; }
  busy=true; const bar=$('#batchProgress'); bar.hidden=false; const prepared=[];
  try{
    const shuffled=[...slots].sort(()=>Math.random()-0.5);
    for(let i=0;i<files.length;i++){
      bar.textContent=`正在准备 ${i+1} / ${files.length} 张…`;
      const blob=await readFile(files[i]); const source=URL.createObjectURL(blob); urls.add(source);
      try{
        const image=await loadPhoto(source); const c=document.createElement('canvas');
        drawCrop(c,image,initialCrop);
        prepared.push({slot:shuffled[i],blob,memory:{source,blob,preview:c.toDataURL('image/jpeg',0.92),crop:{...initialCrop},custom:true,empty:false}});
      }catch(err){ urls.delete(source); URL.revokeObjectURL(source); throw err; }
    }
    bar.textContent='正在保存…';
    await commitPhotos(async()=>prepared.map(({slot,memory,blob})=>({slot,source:blob,preview:memory.preview,crop:memory.crop,empty:false})));
    prepared.forEach(({slot,memory})=>{ memories[slot]=memory; api.setPhoto(slot,memory.preview); });
    api.reset(); $('#uploadMenu').hidden=true;
    audio.play('hang'); toast(`已挂上 ${prepared.length} 张相片`); renderSlots();
  }catch(err){ toast(err.message); }
  finally{ busy=false; bar.hidden=true; }
};

// ---- long-press photo swap (original behavior) ----
let pressTimer=null, dragFrom=-1;
host.addEventListener('pointerdown',(e)=>{
  const t=e.target; if(!(t instanceof HTMLCanvasElement)) return;
  pressTimer=setTimeout(()=>{
    const rect=host.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*2-1, y=-(e.clientY-rect.top)/rect.height*2+1;
    // ask scene which slot is under pointer via select callback on tap; use current selected as fallback
    dragFrom=selected>=0?selected:-1;
    if(dragFrom<0||memories[dragFrom].empty) return;
    const g=$('#dragGhost'); g.src=memories[dragFrom].preview; g.hidden=false;
    g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
  },500);
});
host.addEventListener('pointermove',(e)=>{ const g=$('#dragGhost'); if(!g.hidden){ g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px'; } });
window.addEventListener('pointerup',async(e)=>{
  clearTimeout(pressTimer);
  const g=$('#dragGhost'); if(g.hidden) return;
  g.hidden=true;
  if(dragFrom<0) return;
  const target=document.elementFromPoint(e.clientX,e.clientY);
  if(target===host||host.contains(target)){
    // scene reports hovered slot through selection on tap; swap with next selected if available
    const to=selected>=0&&selected!==dragFrom?selected:(dragFrom+1)%PHOTO_COUNT;
    if(to!==dragFrom){
      try{
        const a=memories[dragFrom],b=memories[to];
        await commitPhotos(async()=>{
          const blobs=[a,b].map(m=>m.empty?null:blobOf(m));
          if(blobs.some((blob,i)=>![a,b][i].empty && !blob)) throw new Error('找不到原始相片数据，请重新挂上这张相片。');
          return [{slot:dragFrom,source:blobs[1],preview:b.preview,crop:b.crop,empty:b.empty},
                  {slot:to,source:blobs[0],preview:a.preview,crop:a.crop,empty:a.empty}];
        });
        api.swapPhotos(dragFrom,to);
        memories[dragFrom]=b; memories[to]=a;
        toast(`${dragFrom+1} 与 ${to+1} 号相片已交换`); renderSlots();
      }catch(err){ toast(err.message); }
    }
  }
  dragFrom=-1;
});
window.addEventListener('beforeunload',()=>{ urls.forEach(u=>URL.revokeObjectURL(u)); audio.dispose(); api?.dispose(); });
</script>
