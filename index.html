<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211044"><title>给你的小小宇宙</title>
<style>
:root{--ink:#fff8ff;--pink:#ffb4df;--bg:#12092e}*{box-sizing:border-box}html,body,main{margin:0;min-height:100%;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}body{overflow:hidden}.scene{min-height:100svh;display:grid;place-content:center;justify-items:center;gap:18px;padding:clamp(28px,7vh,70px) 24px;position:absolute;inset:0;text-align:center;overflow:hidden}.scene[hidden]{display:none}.scene.active{animation:arrive .8s ease}.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(circle at 12% 19%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 80% 13%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 68% 38%,#dccdff 0 1px,transparent 1.8px),radial-gradient(circle at 19% 69%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 91% 79%,#fff 0 1px,transparent 1.8px);background-size:180px 210px;opacity:.8;animation:twinkle 6s alternate infinite}.stars:before{transform:rotate(20deg);opacity:.35}.stars:after{transform:scale(1.4);opacity:.18}.nebula{position:absolute;inset:-30%;background:radial-gradient(ellipse at 50% 92%,#ff80c7b8,transparent 30%),radial-gradient(ellipse at 20% 50%,#5c51ff8f,transparent 29%),radial-gradient(ellipse at 78% 39%,#a850ff57,transparent 31%);filter:blur(24px);animation:drift 12s ease-in-out infinite alternate}.scene>*:not(.stars):not(.nebula){position:relative;z-index:1}.eyebrow{margin:0;letter-spacing:.2em;font-size:11px;color:#fbc8ec}h1,h2{margin:0;line-height:1.15;font-weight:500;text-shadow:0 3px 24px #d55ebb}h1{font-size:clamp(34px,9vw,66px)}h2{font-size:clamp(27px,7vw,48px)}em{font-family:Georgia,serif;font-weight:normal;color:#ffd2ed}.hint,.sub,.tap-note{margin:0;color:#f2dff4;font-size:14px;line-height:1.7}.button{border:1px solid #ffffff73;border-radius:999px;background:linear-gradient(120deg,#ffb4de,#a993ff);color:#fff;padding:14px 22px;font:inherit;box-shadow:0 8px 25px #bc5acb66;cursor:pointer}.start{margin-top:12px}.cake{width:min(76vw,350px);height:310px;position:relative;margin-top:2vh;cursor:pointer}.halo{width:110px;height:110px;position:absolute;left:50%;top:6px;transform:translateX(-50%);border-radius:50%;background:#ffbfad;filter:blur(32px);opacity:.55}.flame{width:30px;height:55px;position:absolute;left:calc(50% - 15px);top:10px;border-radius:55% 45% 55% 45%;transform:rotate(45deg);background:linear-gradient(135deg,#fff8c5,#ffb24c 52%,#e958a3);box-shadow:0 0 28px 11px #ffc165;animation:flicker .9s ease-in-out infinite alternate}.wick{position:absolute;width:4px;height:18px;background:#26122d;left:calc(50% - 2px);top:58px}.candle{position:absolute;width:30px;height:100px;left:calc(50% - 15px);top:72px;border-radius:8px 8px 3px;background:linear-gradient(90deg,#dc77b7,#ffd6ee 48%,#bb5fa8)}.cake-top{position:absolute;width:125px;height:34px;left:calc(50% - 62px);top:155px;border-radius:50%;background:#ffd0e8;box-shadow:inset 0 -8px #df83b7}.cake-body{position:absolute;width:200px;height:75px;left:calc(50% - 100px);top:173px;border-radius:8px 8px 30px 30px;background:linear-gradient(90deg,#a858b2,#eb8fc3 52%,#8e56bd);box-shadow:inset 0 9px #ffd3ea}.cake-body span{position:relative;display:inline-block;width:18px;height:28px;margin:0 16px;background:#ffd2e8;border-radius:0 0 14px 14px}.plate{position:absolute;width:250px;height:30px;left:calc(50% - 125px);top:242px;border-radius:50%;background:#c6b4ff;box-shadow:0 9px 30px #b765ce99}.blown .flame{animation:blow .8s forwards}.blown .halo{opacity:.15}.scene--carousel{align-content:start;padding-top:8vh;gap:12px}.lamp{height:min(58svh,540px);width:min(92vw,540px);position:relative;perspective:850px;touch-action:pan-y}.lamp-top{position:absolute;left:50%;top:5%;width:190px;height:55px;transform:translateX(-50%);border-radius:50% 50% 20px 20px;background:linear-gradient(120deg,#fff3bd,#f7a6d5 55%,#866ee8);box-shadow:0 0 22px #ffd9f3}.lamp-wire{position:absolute;left:50%;top:0;width:2px;height:35%;background:#f5d4ff}.ring{position:absolute;left:50%;top:27%;width:120px;height:150px;transform-style:preserve-3d;transform:translateX(-50%);transition:transform .22s ease-out;animation:spin 24s linear infinite}.lamp.dragging .ring{animation-play-state:paused}.photo{position:absolute;left:0;top:0;width:120px;height:150px;margin:0;padding:5px 5px 23px;background:#fff6fb;box-shadow:0 7px 20px #0d052a88;transform:rotateY(calc(var(--i)*60deg)) translateZ(190px) rotateZ(calc((var(--i) - 2)*2deg));backface-visibility:hidden}.photo div{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(145deg,hsl(calc(var(--i)*38 + 280) 58% 69%),#5b4692);color:#ffffffc9;font-size:12px}.photo figcaption{color:#7b4a81;font-size:9px;margin-top:5px}.lamp-glow{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);width:290px;height:140px;background:#ef9ece;filter:blur(48px);opacity:.8}.lamp-base{position:absolute;bottom:5%;left:50%;width:270px;height:40px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(90deg,#6b4eb5,#ffb4d7,#6b4eb5);box-shadow:0 10px 30px #572870}.continue{margin-top:auto}.scene--letter{background:linear-gradient(145deg,#25124d99,#9e4a8d55)}.letter{width:min(88vw,480px);padding:38px 28px;border:1px solid #ffffff60;border-radius:27px;background:#fff9ff22;backdrop-filter:blur(12px);box-shadow:0 20px 65px #06001c66;text-align:left}.letter h2{text-align:center;margin:10px 0 24px}.letter p{font-size:15px;line-height:1.9;color:#fff1fb}.letter .eyebrow{text-align:center}.signature{text-align:right;margin-bottom:0}@keyframes arrive{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}@keyframes twinkle{to{opacity:.4}}@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg)}}@keyframes flicker{to{transform:rotate(41deg) scale(.86,1.08)}}@keyframes blow{to{opacity:0;transform:translate(32px,-18px) rotate(80deg) scale(.2)}}@keyframes spin{to{transform:translateX(-50%) rotateY(360deg)}}@media(max-height:680px){.cake{height:260px;transform:scale(.85);margin:-8px}.scene{gap:10px;padding-top:20px}.scene--carousel{padding-top:3vh}.lamp{height:48svh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}}
</style></head><body><main aria-live="polite"><div class="stars"></div><div class="nebula"></div>
<section class="scene active" id="intro"><p class="eyebrow">FOR YOUR BIRTHDAY</p><h1>今天，宇宙为你<br><em>亮一整晚</em></h1><p class="hint">轻触星光，开始这份小小惊喜</p><button class="button start" onclick="show('cake')">打开礼物 ✦</button></section>
<section class="scene" id="cake" hidden><p class="eyebrow">MAKE A WISH</p><h2>先许一个愿吧</h2><p class="sub">点击烛火，或对着手机轻轻吹一吹</p><div class="cake" id="cakeTap" role="button" tabindex="0" aria-label="吹灭蜡烛"><div class="halo"></div><div class="flame" id="flame"></div><div class="wick"></div><div class="candle"></div><div class="cake-top"></div><div class="cake-body"><span></span><span></span><span></span></div><div class="plate"></div></div><button class="button" id="mic">开启吹气感应</button><p class="tap-note" id="note">不方便开启麦克风？直接点蜡烛也可以。</p></section>
<section class="scene scene--carousel" id="carousel" hidden><header><p class="eyebrow">OUR LITTLE MOMENTS</p><h2>回忆都挂在星光里</h2><p class="sub">左右拖动照片，找找那些闪闪发光的瞬间</p></header><div class="lamp" id="lamp"><div class="lamp-top"></div><div class="lamp-wire"></div><div class="ring" id="ring"><figure class="photo" style="--i:0"><div>把第一张合照放这里</div><figcaption>第一张合照</figcaption></figure><figure class="photo" style="--i:1"><div>一起吹过的风</div><figcaption>一起吹过的风</figcaption></figure><figure class="photo" style="--i:2"><div>没说完的话</div><figcaption>没说完的话</figcaption></figure><figure class="photo" style="--i:3"><div>最平常的一天</div><figcaption>最平常的一天</figcaption></figure><figure class="photo" style="--i:4"><div>下次还要见面</div><figcaption>下次还要见面</figcaption></figure><figure class="photo" style="--i:5"><div>永远珍藏</div><figcaption>永远珍藏</figcaption></figure></div><div class="lamp-glow"></div><div class="lamp-base"></div></div><button class="button continue" onclick="show('letter')">收下最后一封信 →</button></section>
<section class="scene scene--letter" id="letter" hidden><div class="letter"><p class="eyebrow">A NOTE FOR YOU</p><h2>生日快乐呀，<br><em>我的好朋友</em></h2><p>愿你被爱、被理解，也永远保留对生活的好奇。愿每一个普通日子里，都有不期而遇的小确幸。</p><p>新的一岁，请继续做那个闪闪发光、无可替代的你。我们一起把快乐存档，慢慢把日子过成星河。</p><p class="signature">永远站在你这边的人<br>2026.11.15</p></div><button class="button" onclick="reset()">再看一次星光</button></section>
</main><script>
const ids=['intro','cake','carousel','letter'],q=s=>document.querySelector(s);function show(id){ids.forEach(x=>{const e=q('#'+x),v=x===id;e.hidden=!v;e.classList.toggle('active',v)})}function blow(){if(q('#flame').classList.contains('out'))return;q('#flame').classList.add('out');q('#cakeTap').classList.add('blown');q('#note').textContent='愿望已被星光收到 ✦';setTimeout(()=>show('carousel'),1300)}function reset(){q('#flame').classList.remove('out');q('#cakeTap').classList.remove('blown');q('#note').textContent='不方便开启麦克风？直接点蜡烛也可以。';show('intro')}q('#cakeTap').onclick=blow;q('#cakeTap').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')blow()};q('#mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),c=new AudioContext,a=c.createMediaStreamSource(s),n=c.createAnalyser();n.fftSize=512;a.connect(n);const d=new Uint8Array(n.frequencyBinCount);q('#note').textContent='听见你的呼吸啦，吹一下试试…';(function l(){n.getByteFrequencyData(d);if(d.reduce((x,y)=>x+y,0)/d.length>26){s.getTracks().forEach(t=>t.stop());c.close();blow()}else requestAnimationFrame(l)})()}catch{q('#note').textContent='没有获得麦克风权限，点烛火也能许愿。'}};let sx=0,angle=0,lamp=q('#lamp'),ring=q('#ring');lamp.onpointerdown=e=>{sx=e.clientX;lamp.setPointerCapture(e.pointerId);lamp.classList.add('dragging')};lamp.onpointermove=e=>{if(!lamp.classList.contains('dragging'))return;angle+=(e.clientX-sx)*.45;sx=e.clientX;ring.style.transform='translateX(-50%) rotateY('+angle+'deg)'};['pointerup','pointercancel'].forEach(t=>lamp.addEventListener(t,()=>lamp.classList.remove('dragging')));
</script></body></html>
